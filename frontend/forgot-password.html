<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060F">
<title>Forgot Password — VASTU ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-system.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

<div class="card" style="max-width: 440px; width: 100%; padding: var(--space-7);">
    <div class="text-center mb-6">
        <a href="/" class="navbar-brand" style="justify-content: center; display: flex; font-size: 28px;">
            VASTU <span class="gold">ONE</span>
        </a>
    </div>
    
    <h2 style="text-align: center; margin-bottom: var(--space-3);">Reset your password</h2>
    <p class="text-muted text-sm text-center mb-6">
        Enter your email address and we'll send you a link to reset your password.
    </p>
    
    <form id="forgot-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" id="email" required
                   placeholder="you@example.com" autocomplete="email" autofocus>
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">
            Send Reset Link
        </button>
    </form>
    
    <div id="success-message" class="hidden" style="text-align: center; padding: var(--space-4); background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3); border-radius: var(--radius-md); margin-top: var(--space-5);">
        <div style="font-size: 40px; margin-bottom: var(--space-3);">📧</div>
        <div class="text-gold" style="font-weight: 600;">Check your email</div>
        <p class="text-muted text-sm mt-2">
            If an account exists with that email, we've sent a reset link. Check your inbox and spam folder.
        </p>
    </div>
    
    <div class="text-center mt-6">
        <a href="/login.html" class="text-muted text-sm">← Back to Login</a>
    </div>
</div>

<script src="/static/api.js"></script>
<script>
async function handleSubmit(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const btn = document.getElementById('submit-btn');
    
    try {
        btn.disabled = true;
        btn.textContent = 'Sending...';
        VastuAPI.UI.loading(true);
        
        await VastuAPI.apiCall('/api/auth/forgot-password', {
            method: 'POST',
            body: { email },
            noAuth: true,
        });
        
        document.getElementById('forgot-form').classList.add('hidden');
        document.getElementById('success-message').classList.remove('hidden');
    } catch (err) {
        VastuAPI.UI.toast('Error: ' + err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
        VastuAPI.UI.loading(false);
    }
}
</script>
</body>
</html>
