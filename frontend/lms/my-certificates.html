<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Certificates — Vastu One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-system.css">
<link rel="stylesheet" href="/static/i18n.css">
<style>
  :root {
    --void-black: #05060F;
    --deep-space: #0A0C1A;
    --space: #101324;
    --starlight: #F8F7F2;
    --muted-white: #8B8B93;
    --cosmic-gold: #D4AF37;
    --gold-dim: #8B7020;
    --border-subtle: 1px solid rgba(212, 175, 55, 0.15);
    --border-gold: 1px solid rgba(212, 175, 55, 0.4);
    --radius-lg: 20px;
    --radius-xl: 28px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void-black);
    color: var(--starlight);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .navbar {
    border-bottom: var(--border-subtle);
    padding: 20px 0;
    background: rgba(5, 6, 15, 0.95);
    backdrop-filter: blur(20px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .navbar-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--starlight);
    text-decoration: none;
  }

  .brand .gold { color: var(--cosmic-gold); }

  .navbar-nav {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .navbar-nav a {
    color: var(--muted-white);
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .navbar-nav a:hover,
  .navbar-nav a.active {
    color: var(--cosmic-gold);
    background: rgba(212, 175, 55, 0.08);
  }

  .page-header {
    padding: 60px 0 40px;
  }

  .page-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .page-subtitle {
    color: var(--muted-white);
    font-size: 15px;
  }

  .certificates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
    padding-bottom: 80px;
  }

  .cert-card {
    background: linear-gradient(180deg, var(--space) 0%, var(--deep-space) 100%);
    border: var(--border-gold);
    border-radius: var(--radius-lg);
    padding: 28px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  .cert-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--cosmic-gold), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .cert-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.1);
  }

  .cert-card:hover::before { opacity: 1; }

  .cert-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
    border: 1.5px solid var(--cosmic-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 20px;
  }

  .cert-course {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--starlight);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .cert-meta {
    color: var(--muted-white);
    font-size: 12px;
    margin-bottom: 20px;
  }

  .cert-number {
    font-family: 'Courier New', monospace;
    color: var(--cosmic-gold);
    background: rgba(212, 175, 55, 0.08);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 0.05em;
    display: inline-block;
    margin-bottom: 20px;
  }

  .cert-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    transition: all 0.2s ease;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }

  .btn-primary {
    background: var(--cosmic-gold);
    color: var(--void-black);
  }

  .btn-primary:hover {
    background: #e6c04a;
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--cosmic-gold);
    border: var(--border-gold);
  }

  .btn-secondary:hover {
    background: rgba(212, 175, 55, 0.08);
  }

  .empty-state {
    text-align: center;
    padding: 100px 20px;
    grid-column: 1 / -1;
  }

  .empty-icon {
    font-size: 72px;
    margin-bottom: 24px;
    opacity: 0.3;
  }

  .empty-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    color: var(--starlight);
    margin-bottom: 12px;
  }

  .empty-text {
    color: var(--muted-white);
    font-size: 15px;
    margin-bottom: 24px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }

  .loading {
    text-align: center;
    padding: 80px 20px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(212, 175, 55, 0.2);
    border-top-color: var(--cosmic-gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .page-title { font-size: 32px; }
    .certificates-grid { grid-template-columns: 1fr; }
    .navbar-nav a { padding: 6px 10px; font-size: 13px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container navbar-content">
    <a href="/dashboard.html" class="brand">VASTU <span class="gold">ONE</span></a>
    <div class="navbar-nav">
      <a href="/dashboard.html" data-i18n="admin.dashboard">Dashboard</a>
      <a href="/lms/courses.html" data-i18n="admin.courses">Courses</a>
      <a href="/lms/my-certificates.html" class="active">Certificates</a>
      <div data-language-switcher style="margin-left: 12px;"></div>
    </div>
  </div>
</nav>

<main class="container">

  <div class="page-header">
    <h1 class="page-title">My Certificates</h1>
    <p class="page-subtitle">Your achievements from Vastu One Academy</p>
  </div>

  <!-- LOADING -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="color: var(--muted-white);">Loading certificates...</p>
  </div>

  <!-- CERTIFICATES GRID -->
  <div class="certificates-grid hidden" id="certificates-grid"></div>

</main>

<script src="/static/api.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/language-switcher.js"></script>
<script>
async function loadCertificates() {
  const token = localStorage.getItem('vastu_access_token');
  if (!token) {
    window.location.href = '/login.html';
    return;
  }

  try {
    const res = await fetch('/api/lms/v2/certificates/my-certificates', {
      headers: { 'Authorization': 'Bearer ' + token }
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    renderCertificates(data.certificates || []);
  } catch (e) {
    console.error('Failed to load certificates:', e);
    renderEmpty('Could not load certificates. Please try again.');
  }
}

function renderCertificates(certs) {
  document.getElementById('loading').classList.add('hidden');
  const grid = document.getElementById('certificates-grid');
  grid.classList.remove('hidden');

  if (certs.length === 0) {
    renderEmpty('You haven\'t earned any certificates yet. Complete a course to unlock yours!');
    return;
  }

  grid.innerHTML = certs.map(cert => `
    <div class="cert-card">
      <div class="cert-icon">🎓</div>
      <div class="cert-course">${escapeHtml(cert.course_title)}</div>
      <div class="cert-meta">Issued: ${formatDate(cert.issued_at)}</div>
      <div class="cert-number">${escapeHtml(cert.certificate_number)}</div>
      <div class="cert-actions">
        <a href="${cert.download_url}" class="btn btn-primary" onclick="downloadWithAuth(event, '${cert.download_url}')">
          ⬇ Download PDF
        </a>
        <button class="btn btn-secondary" onclick="copyVerifyLink('${cert.verify_url}')">
          🔗 Verify
        </button>
      </div>
    </div>
  `).join('');
}

function renderEmpty(message) {
  document.getElementById('loading').classList.add('hidden');
  const grid = document.getElementById('certificates-grid');
  grid.classList.remove('hidden');
  grid.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🎓</div>
      <h2 class="empty-title">No Certificates Yet</h2>
      <p class="empty-text">${escapeHtml(message)}</p>
      <a href="/lms/courses.html" class="btn btn-primary" style="display: inline-flex; max-width: 240px;">Browse Courses</a>
    </div>
  `;
}

async function downloadWithAuth(e, url) {
  e.preventDefault();
  const token = localStorage.getItem('vastu_access_token');
  if (!token) return;

  try {
    const res = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('Download failed');

    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = 'certificate.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
  } catch (err) {
    alert('Download failed. Please try again.');
  }
}

function copyVerifyLink(verifyUrl) {
  const fullUrl = window.location.origin + verifyUrl;
  navigator.clipboard.writeText(fullUrl).then(() => {
    alert('Verify link copied!\n\n' + fullUrl);
  }).catch(() => {
    prompt('Copy this verify link:', fullUrl);
  });
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[s]));
}

// Init
if (window.I18n) window.I18n.init();
loadCertificates();
</script>

</body>
</html>
