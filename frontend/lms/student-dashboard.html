<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060F">
<title>My Learning Dashboard — VASTU ONE Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-system.css">
<style>
/* Dashboard-specific styles */
.streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(239, 68, 68, 0.15));
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    color: var(--warning);
    margin-bottom: 24px;
}

.streak-fire {
    font-size: 20px;
    animation: pulse-fire 2s infinite;
}

@keyframes pulse-fire {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

.stat-card {
    padding: 24px;
    background: var(--space);
    border: 1px solid rgba(248, 247, 242, 0.08);
    border-radius: 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cosmic-gold), transparent);
    opacity: 0.5;
}

.stat-icon {
    font-size: 28px;
    margin-bottom: 12px;
    display: block;
}

.stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--starlight);
    line-height: 1;
    margin-bottom: 6px;
}

.stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted-white);
    font-weight: 600;
}

.course-card {
    padding: 24px;
    background: var(--space);
    border: 1px solid rgba(248, 247, 242, 0.08);
    border-radius: 12px;
    margin-bottom: 16px;
    transition: all 0.3s;
}

.course-card:hover {
    border-color: rgba(212, 175, 55, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(212, 175, 55, 0.1);
}

.course-progress-bar {
    height: 8px;
    background: var(--deep-space);
    border-radius: 4px;
    overflow: hidden;
    margin: 16px 0;
}

.course-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cosmic-gold), var(--gold-light));
    border-radius: 4px;
    transition: width 0.6s ease;
}

.next-lesson {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--deep-space);
    border-radius: 8px;
    margin-top: 12px;
    font-size: 13px;
}

.achievement-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
}

.achievement-badge {
    padding: 16px 12px;
    background: var(--space);
    border: 1px solid rgba(248, 247, 242, 0.08);
    border-radius: 12px;
    text-align: center;
    transition: all 0.3s;
}

.achievement-badge.earned {
    border-color: rgba(212, 175, 55, 0.4);
    background: linear-gradient(180deg, rgba(212, 175, 55, 0.08), var(--space));
}

.achievement-badge.locked {
    opacity: 0.4;
    filter: grayscale(1);
}

.achievement-icon {
    font-size: 32px;
    margin-bottom: 8px;
    display: block;
}

.achievement-title {
    font-weight: 600;
    font-size: 12px;
    color: var(--starlight);
    margin-bottom: 4px;
}

.achievement-desc {
    font-size: 10px;
    color: var(--muted-white);
    line-height: 1.3;
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    background: var(--space);
    border: 1px dashed rgba(248, 247, 242, 0.15);
    border-radius: 12px;
}

.empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="container navbar-content">
        <a href="/dashboard.html" class="navbar-brand">VASTU <span class="gold">ONE</span></a>
        <div class="navbar-nav">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/clients.html">Clients</a>
            <a href="/properties.html">Properties</a>
            <a href="/reports.html">Reports</a>
            <a href="/lms/courses.html" class="active">Academy</a>
        </div>
        <div class="navbar-actions">
            <span class="text-muted text-sm" id="user-name">—</span>
            <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </div>
</nav>

<!-- BOTTOM NAV (Mobile) -->
<div class="bottom-nav">
    <div class="bottom-nav-items">
        <a href="/dashboard.html" class="bottom-nav-item">
            <span class="bottom-nav-item-icon">📊</span>
            <span>Home</span>
        </a>
        <a href="/lms/courses.html" class="bottom-nav-item">
            <span class="bottom-nav-item-icon">📚</span>
            <span>Courses</span>
        </a>
        <a href="/lms/student-dashboard.html" class="bottom-nav-item active">
            <span class="bottom-nav-item-icon">🎓</span>
            <span>Learning</span>
        </a>
        <a href="/settings.html" class="bottom-nav-item">
            <span class="bottom-nav-item-icon">⚙️</span>
            <span>Settings</span>
        </a>
    </div>
</div>

<main class="container" style="padding-top: var(--space-7); padding-bottom: 100px;">

    <!-- WELCOME + STREAK -->
    <div class="mb-6">
        <h1 id="welcome-heading">My Learning</h1>
        <div class="streak-badge" id="streak-badge">
            <span class="streak-fire">🔥</span>
            <span id="streak-text">Loading...</span>
        </div>
    </div>

    <!-- STATS -->
    <div class="grid grid-4 mb-7">
        <div class="stat-card">
            <span class="stat-icon">📚</span>
            <div class="stat-value" id="stat-courses">—</div>
            <div class="stat-label">Courses</div>
        </div>
        <div class="stat-card">
            <span class="stat-icon">✅</span>
            <div class="stat-value" id="stat-lessons">—</div>
            <div class="stat-label">Lessons Done</div>
        </div>
        <div class="stat-card">
            <span class="stat-icon">⏱️</span>
            <div class="stat-value" id="stat-minutes">—</div>
            <div class="stat-label">Minutes</div>
        </div>
        <div class="stat-card">
            <span class="stat-icon">🏆</span>
            <div class="stat-value" id="stat-achievements">—</div>
            <div class="stat-label">Achievements</div>
        </div>
    </div>

    <!-- CONTINUE LEARNING -->
    <div class="mb-7">
        <h2 class="mb-4">Continue Learning</h2>
        <div id="continue-list">
            <div class="text-muted text-sm">Loading...</div>
        </div>
    </div>

    <!-- UPCOMING DEADLINES -->
    <div class="mb-7">
        <h2 class="mb-4">Upcoming Deadlines</h2>
        <div id="deadlines-list">
            <div class="text-muted text-sm">Loading...</div>
        </div>
    </div>

    <!-- ACHIEVEMENTS -->
    <div class="mb-7">
        <h2 class="mb-4">🏆 Achievements</h2>
        <div id="achievements-grid" class="achievement-grid">
            <div class="text-muted text-sm">Loading...</div>
        </div>
    </div>

</main>

<script src="/static/api.js"></script>
<script>
async function handleLogout() {
    VastuAPI.Auth.clear();
    window.location.href = '/login.html';
}

async function requireAuth() {
    if (!VastuAPI.Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return false;
    }
    return true;
}

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
}

async function loadUser() {
    try {
        const me = await VastuAPI.API.auth.me();
        VastuAPI.Auth.setUser(me);
        document.getElementById('user-name').textContent = me.full_name;
        document.getElementById('welcome-heading').textContent = `Welcome back, ${me.full_name.split(' ')[0]} 👋`;
    } catch (err) { console.error(err); }
}

async function loadStats() {
    try {
        const data = await VastuAPI.apiCall('/api/lms/v2/dashboard/stats');
        
        // Stats
        document.getElementById('stat-courses').textContent = data.stats.total_courses || 0;
        document.getElementById('stat-lessons').textContent = data.stats.completed_lessons || 0;
        document.getElementById('stat-minutes').textContent = (data.stats.total_minutes || 0).toLocaleString('en-IN');
        document.getElementById('stat-achievements').textContent = data.stats.achievements_count || 0;
        
        // Streak
        const streak = data.stats.current_streak || 0;
        const streakText = streak > 0 
            ? `${streak}-day learning streak! Keep it up.` 
            : 'Start learning today to build your streak.';
        document.getElementById('streak-text').textContent = streakText;
        
        // Deadlines
        const dl = document.getElementById('deadlines-list');
        if (data.upcoming_assignments && data.upcoming_assignments.length > 0) {
            dl.innerHTML = data.upcoming_assignments.map(a => `
                <div class="card mb-3" style="padding: 16px;">
                    <div class="flex-between">
                        <div>
                            <div style="font-weight: 600;">📝 ${escapeHtml(a.title)}</div>
                            <div class="text-faint text-xs mt-1">
                                Due in ${a.due_days} days • Max score: ${a.max_score}
                            </div>
                        </div>
                        <span class="badge badge-warning">PENDING</span>
                    </div>
                </div>
            `).join('');
        } else {
            dl.innerHTML = '<div class="text-muted text-sm">No pending assignments 🎉</div>';
        }
    } catch (err) {
        console.error('Stats error:', err);
    }
}

async function loadContinueLearning() {
    try {
        const data = await VastuAPI.apiCall('/api/lms/v2/dashboard/continue-learning');
        const el = document.getElementById('continue-list');
        
        if (!data.courses || data.courses.length === 0) {
            el.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🎓</div>
                    <h3 class="mb-3">Start your learning journey</h3>
                    <p class="text-muted mb-5">Browse our courses and enroll in your first one.</p>
                    <a href="/lms/courses.html" class="btn btn-primary">Browse Courses</a>
                </div>
            `;
            return;
        }
        
        el.innerHTML = data.courses.map(c => `
            <div class="course-card">
                <div class="flex-between" style="flex-wrap: wrap; gap: 12px;">
                    <div>
                        <h3 style="margin: 0 0 4px;">📚 ${escapeHtml(c.course_title)}</h3>
                        <div class="text-faint text-xs">Course Progress</div>
                    </div>
                    <div class="text-gold" style="font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700;">
                        ${Math.round(c.progress_pct)}%
                    </div>
                </div>
                
                <div class="course-progress-bar">
                    <div class="course-progress-fill" style="width: ${c.progress_pct}%;"></div>
                </div>
                
                ${c.next_lesson_title ? `
                    <div class="next-lesson">
                        <div>
                            <div class="text-faint text-xs">NEXT LESSON</div>
                            <div style="font-weight: 500; margin-top: 2px;">${escapeHtml(c.next_lesson_title)}</div>
                        </div>
                        <a href="/lms/course-player.html?course_id=${c.course_id}&lesson_id=${c.next_lesson_id}" class="btn btn-primary btn-sm">
                            Resume →
                        </a>
                    </div>
                ` : `
                    <div class="next-lesson">
                        <div>
                            <div class="text-gold text-sm">🎉 All lessons completed!</div>
                        </div>
                        <a href="/lms/course-detail.html?course_id=${c.course_id}" class="btn btn-secondary btn-sm">
                            View Certificate
                        </a>
                    </div>
                `}
            </div>
        `).join('');
    } catch (err) {
        console.error('Continue learning error:', err);
    }
}

async function loadAchievements() {
    try {
        const data = await VastuAPI.apiCall('/api/lms/v2/dashboard/achievements');
        const el = document.getElementById('achievements-grid');
        
        const allBadges = [
            ...data.earned.map(b => ({...b, unlocked: true})),
            ...data.locked.filter(b => !b.unlocked).map(b => ({...b, unlocked: false})),
        ];
        
        if (allBadges.length === 0) {
            el.innerHTML = '<div class="text-muted text-sm">No achievements yet. Keep learning!</div>';
            return;
        }
        
        el.innerHTML = allBadges.map(b => `
            <div class="achievement-badge ${b.unlocked ? 'earned' : 'locked'}">
                <span class="achievement-icon">${b.icon || '🏆'}</span>
                <div class="achievement-title">${escapeHtml(b.title)}</div>
                <div class="achievement-desc">${escapeHtml(b.desc || b.description || '')}</div>
            </div>
        `).join('');
    } catch (err) {
        console.error('Achievements error:', err);
    }
}

async function init() {
    if (!await requireAuth()) return;
    await loadUser();
    await Promise.all([
        loadStats(),
        loadContinueLearning(),
        loadAchievements(),
    ]);
}

init();
</script>
</body>
</html>
