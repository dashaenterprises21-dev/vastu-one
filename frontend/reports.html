<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports — VASTU ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-system.css">
</head>
<body>

<nav class="navbar">
    <div class="container navbar-content">
        <a href="/dashboard.html" class="navbar-brand">VASTU <span class="gold">ONE</span></a>
        <div class="navbar-nav">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/clients.html">Clients</a>
            <a href="/properties.html">Properties</a>
            <a href="/reports.html" class="active">Reports</a>
            <a href="/lms/courses.html">LMS</a>
        </div>
        <div class="flex gap-3" style="align-items: center;">
            <span class="text-muted text-sm" id="user-name">—</span>
            <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </div>
</nav>

<main class="container" style="padding-top: var(--space-7); padding-bottom: var(--space-7);">

    <div class="flex-between mb-6">
        <div>
            <h1>Reports</h1>
            <p class="text-muted mt-2">Generate and manage Vastu analysis reports</p>
        </div>
        <button class="btn btn-primary" onclick="openGenerateModal()">+ Generate Report</button>
    </div>

    <div id="reports-list">
        <div class="text-muted text-sm">Loading...</div>
    </div>

</main>

<!-- GENERATE MODAL -->
<div class="modal-backdrop hidden" id="generate-modal">
    <div class="modal" style="max-width: 600px;">
        <div class="flex-between mb-5">
            <h3 class="card-title">Generate Report</h3>
            <button class="btn btn-ghost btn-sm" onclick="closeGenerateModal()">✕</button>
        </div>
        
        <form id="generate-form" onsubmit="handleGenerate(event)">
            <div class="form-group">
                <label class="form-label">Property *</label>
                <select class="form-select" id="gen-property" required>
                    <option value="">Select a property...</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Package</label>
                <select class="form-select" id="gen-package">
                    <option value="vastu_basic">Vastu Basic — 499</option>
                    <option value="vastu_advanced" selected>Vastu Advanced — 2,999</option>
                    <option value="vastu_super_advanced">Vastu Super Advanced — 4,999</option>
                    <option value="astro_vastu_combo">Astro + Vastu — 7,999</option>
                    <option value="triple_system">Triple System — 11,999</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Price ()</label>
                <input type="number" class="form-input" id="gen-price" value="2999">
            </div>
            
            <div class="card mb-4" style="background: var(--deep-space); padding: var(--space-4);">
                <div class="text-sm text-muted mb-3">Optional — Additional property data</div>
                
                <div class="form-group">
                    <label class="form-label text-xs">Soil Colour</label>
                    <select class="form-select" id="gen-soil-colour">
                        <option value="">— Skip —</option>
                        <option value="white">White</option>
                        <option value="red">Red</option>
                        <option value="yellow">Yellow</option>
                        <option value="black">Black</option>
                        <option value="mixed">Mixed</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label text-xs">Septic Tank Direction</label>
                    <select class="form-select" id="gen-septic">
                        <option value="">— Skip —</option>
                        <option value="NE">NE</option>
                        <option value="N">N</option>
                        <option value="E">E</option>
                        <option value="SE">SE</option>
                        <option value="S">S</option>
                        <option value="SW">SW</option>
                        <option value="W">W</option>
                        <option value="NW">NW</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label text-xs">Underground Tank Direction</label>
                    <select class="form-select" id="gen-underground">
                        <option value="">— Skip —</option>
                        <option value="NE">NE</option>
                        <option value="N">N</option>
                        <option value="E">E</option>
                        <option value="SE">SE</option>
                        <option value="S">S</option>
                        <option value="SW">SW</option>
                        <option value="W">W</option>
                        <option value="NW">NW</option>
                    </select>
                </div>
            </div>
            
            <div class="flex gap-3 mt-5">
                <button type="button" class="btn btn-ghost" style="flex: 1;" onclick="closeGenerateModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" style="flex: 2;" id="gen-btn">Generate Report</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-backdrop hidden" id="delete-modal">
    <div class="modal" style="max-width: 420px;">
        <h3 class="card-title mb-3">⚠️ Delete Report</h3>
        <p class="text-muted mb-5">
            Are you sure you want to delete this report? This action cannot be undone.
        </p>
        <div class="flex gap-3">
            <button class="btn btn-ghost" style="flex: 1;" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn btn-danger" style="flex: 1;" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<script src="/static/api.js"></script>
<script>
let allReports = [];
let allProperties = [];
let pendingDeleteId = null;

async function handleLogout() {
    VastuAPI.Auth.clear();
    window.location.href = '/login.html';
}

async function requireAuth() {
    if (!VastuAPI.Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return false;
    }
    return true;
}

async function loadUser() {
    try {
        const me = await VastuAPI.API.auth.me();
        document.getElementById('user-name').textContent = me.full_name;
    } catch (err) { console.error(err); }
}

async function loadProperties() {
    const data = await VastuAPI.API.properties.list();
    allProperties = data.items || [];
    
    const el = document.getElementById('gen-property');
    el.innerHTML = '<option value="">Select a property...</option>' +
        allProperties.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
    
    // Pre-select from URL
    const urlParams = new URLSearchParams(window.location.search);
    const propId = urlParams.get('property_id');
    if (propId) el.value = propId;
}

async function loadReports() {
    try {
        VastuAPI.UI.loading(true);
        const data = await VastuAPI.API.reports.list();
        allReports = data.items || [];
        renderReports();
    } catch (err) {
        VastuAPI.UI.toast('Failed to load reports: ' + err.message, 'error');
    } finally {
        VastuAPI.UI.loading(false);
    }
}

function renderReports() {
    const el = document.getElementById('reports-list');
    
    if (!allReports.length) {
        el.innerHTML = `
            <div class="card text-center" style="padding: var(--space-7);">
                <div class="text-muted mb-4">No reports yet.</div>
                <button class="btn btn-primary" onclick="openGenerateModal()">+ Generate First Report</button>
            </div>
        `;
        return;
    }
    
    el.innerHTML = allReports.map(r => {
        const prop = allProperties.find(p => p.id === r.property_id);
        const score = r.scores?.score || 0;
        const verdict = r.guna_profile?.verdict || '—';
        const findings = r.findings?.length || 0;
        
        const scoreClass = score >= 75 ? 'good' : score >= 50 ? 'warn' : 'bad';
        const statusClass = {
            'DRAFT': 'badge-info',
            'IN_REVIEW': 'badge-warning',
            'APPROVED': 'badge-gold',
            'DELIVERED': 'badge-success',
        }[r.status] || 'badge-info';
        
        return `
            <div class="card mb-4">
                <div class="flex-between mb-4" style="align-items: flex-start;">
                    <div>
                        <div class="flex gap-2" style="align-items: center;">
                            <div style="font-weight: 600; font-size: 18px;">${escapeHtml(prop?.name || 'Unknown Property')}</div>
                            <span class="badge ${statusClass}">${r.status}</span>
                        </div>
                        <div class="text-muted text-sm mt-2">
                            ${r.package.replace('_', ' ').toUpperCase()} • ${VastuAPI.UI.formatDate(r.created_at)}
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button class="btn btn-primary btn-sm" onclick="downloadPDF('${r.id}')">📄 Download PDF</button>
                        <button class="btn btn-ghost btn-sm" onclick="handleDelete('${r.id}')">Delete</button>
                    </div>
                </div>
                
                <div class="grid grid-3" style="gap: var(--space-4);">
                    <div class="metric-card" style="padding: var(--space-4);">
                        <div class="metric-label">Score</div>
                        <div class="metric-value ${scoreClass}" style="font-size: 28px;">${score}</div>
                    </div>
                    <div class="metric-card" style="padding: var(--space-4);">
                        <div class="metric-label">Verdict</div>
                        <div style="font-size: 14px; font-weight: 600; margin-top: 4px;">${verdict}</div>
                    </div>
                    <div class="metric-card" style="padding: var(--space-4);">
                        <div class="metric-label">Findings</div>
                        <div class="metric-value" style="font-size: 28px;">${findings}</div>
                    </div>
                </div>
                
                ${r.guna_profile ? `
                    <div class="mt-4">
                        <div class="text-xs text-muted mb-2">GUNA PROFILE</div>
                        <div class="guna-bar" style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--deep-space);">
                            <div style="background: #DC2626; width: ${(r.guna_profile.tamas_score || 0) * 100}%;"></div>
                            <div style="background: #F59E0B; width: ${(r.guna_profile.rajas_score || 0) * 100}%;"></div>
                            <div style="background: #16A34A; width: ${(r.guna_profile.sattva_score || 0) * 100}%;"></div>
                        </div>
                        <div class="flex gap-4 mt-2 text-xs">
                            <div><span style="color: #DC2626;">■</span> Tamas: ${Math.round((r.guna_profile.tamas_score || 0) * 100)}%</div>
                            <div><span style="color: #F59E0B;">■</span> Rajas: ${Math.round((r.guna_profile.rajas_score || 0) * 100)}%</div>
                            <div><span style="color: #16A34A;">■</span> Sattva: ${Math.round((r.guna_profile.sattva_score || 0) * 100)}%</div>
                        </div>
                    </div>
                ` : ''}
            </div>
        `;
    }).join('');
}

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
}

function openGenerateModal() {
    document.getElementById('generate-form').reset();
    
    // Pre-select property from URL
    const urlParams = new URLSearchParams(window.location.search);
    const propId = urlParams.get('property_id');
    if (propId) document.getElementById('gen-property').value = propId;
    
    document.getElementById('generate-modal').classList.remove('hidden');
}

function closeGenerateModal() {
    document.getElementById('generate-modal').classList.add('hidden');
}

async function handleGenerate(e) {
    e.preventDefault();
    
    const propertyId = document.getElementById('gen-property').value;
    const propertyData = {};
    
    const soilColour = document.getElementById('gen-soil-colour').value;
    if (soilColour) {
        propertyData.soil = { colour: soilColour, texture: 'loamy', taste: 'sweet' };
    }
    
    const waterFeatures = {};
    const septic = document.getElementById('gen-septic').value;
    if (septic) waterFeatures.septic_tank = septic;
    const underground = document.getElementById('gen-underground').value;
    if (underground) waterFeatures.underground_tank = underground;
    if (Object.keys(waterFeatures).length) propertyData.water_features = waterFeatures;
    
    const payload = {
        property_id: propertyId,
        package: document.getElementById('gen-package').value,
        price_inr: parseFloat(document.getElementById('gen-price').value),
        property_data: propertyData,
    };
    
    try {
        VastuAPI.UI.loading(true);
        document.getElementById('gen-btn').textContent = 'Generating...';
        await VastuAPI.API.reports.generate(payload);
        VastuAPI.UI.toast('Report generated', 'success');
        closeGenerateModal();
        await loadReports();
    } catch (err) {
        VastuAPI.UI.toast('Failed: ' + err.message, 'error');
    } finally {
        VastuAPI.UI.loading(false);
        document.getElementById('gen-btn').textContent = 'Generate Report';
    }
}

async function downloadPDF(id) {
    try {
        VastuAPI.UI.loading(true);
        await VastuAPI.API.reports.downloadPDF(id);
        VastuAPI.UI.toast('PDF downloaded', 'success');
    } catch (err) {
        VastuAPI.UI.toast('PDF failed: ' + err.message, 'error');
    } finally {
        VastuAPI.UI.loading(false);
    }
}

function handleDelete(id) {
    pendingDeleteId = id;
    document.getElementById('delete-modal').classList.remove('hidden');
}

function closeDeleteModal() {
    pendingDeleteId = null;
    document.getElementById('delete-modal').classList.add('hidden');
}

async function confirmDelete() {
    if (!pendingDeleteId) return;
    try {
        VastuAPI.UI.loading(true);
        await VastuAPI.API.reports.remove(pendingDeleteId);
        VastuAPI.UI.toast('Report deleted', 'success');
        closeDeleteModal();
        await loadReports();
    } catch (err) {
        VastuAPI.UI.toast('Delete failed: ' + err.message, 'error');
    } finally {
        VastuAPI.UI.loading(false);
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeGenerateModal(); closeDeleteModal(); }
});

async function init() {
    if (!await requireAuth()) return;
    await loadUser();
    await loadProperties();
    await loadReports();
}

init();
</script>
</body>
</html>
