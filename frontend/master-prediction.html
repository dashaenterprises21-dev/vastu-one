<script>
var DATA = null;

function switchTab(name) {
  document.querySelectorAll('.mp-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.mp-content').forEach(function(c) { c.classList.remove('active'); });
  document.querySelector('.mp-tab[data-tab="' + name + '"]').classList.add('active');
  var el = document.getElementById('tab-' + name);
  if (el) el.classList.add('active');
}

function overviewHtml(d) {
  var h = '<div class="section"><div class="section-title">Master Summary</div><div class="stat-grid">';

  h += '<div class="stat-card"><div class="stat-label">Ascendant</div><div class="stat-value">' + d.chart.ascendant.rashi + '</div><div class="stat-sub">' + d.chart.ascendant.degree + ' deg</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Mahadasha</div><div class="stat-value">' + d.complete_dasha.levels.mahadasha.planet + '</div><div class="stat-sub">' + d.complete_dasha.levels.mahadasha.start_date + '</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Antardasha</div><div class="stat-value">' + d.complete_dasha.levels.antardasha.planet + '</div><div class="stat-sub">Current</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Pratyantardasha</div><div class="stat-value">' + d.complete_dasha.levels.pratyantardasha.planet + '</div><div class="stat-sub">Current</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Total Yogas</div><div class="stat-value">' + d.yogas_complete.total_yogas + '</div><div class="stat-sub">' + d.yogas_complete.auspicious.length + ' auspicious</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Transit Verdict</div><div class="stat-value">' + d.transit_ashtakavarga.overall_verdict + '</div><div class="stat-sub">' + d.transit_ashtakavarga.positive_count + ' positive</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Strongest Planet</div><div class="stat-value">' + d.shadbala.strongest + '</div><div class="stat-sub">Shadbala</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Weakest Planet</div><div class="stat-value">' + d.shadbala.weakest + '</div><div class="stat-sub">Shadbala</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Nadi Type</div><div class="stat-value">' + (d.nadi_bhrigu.nadi_karma.nadi || '') + '</div><div class="stat-sub">' + (d.nadi_bhrigu.nadi_karma.past_life || '') + '</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Karmic Debts</div><div class="stat-value">' + d.nadi_bhrigu.karmic_debts.length + '</div><div class="stat-sub">To resolve</div></div>';
  h += '</div></div>';
  
  h += '<div class="section"><div class="section-title">Executive Summary</div>';
  h += '<div class="item"><div class="item-body">' + d.country + ' is in <strong>' + d.complete_dasha.levels.mahadasha.planet + ' Mahadasha</strong> with <strong>' + d.complete_dasha.levels.antardasha.planet + ' Antardasha</strong> and <strong>' + d.complete_dasha.levels.pratyantardasha.planet + ' Pratyantardasha</strong>. Current transit verdict is <strong>' + d.transit_ashtakavarga.overall_verdict + '</strong>.</div>';
  h += '<div class="item-reasoning"><strong>Analysis:</strong> 6 layers analyzed  Planetary Deep (20+ attrs per planet), Dasha (5 levels with exact dates), Yogas (' + d.yogas_complete.total_yogas + '), Ashtakavarga+Transit (bindu analysis), Varshphal (3 years), Nadi/Bhrigu (karmic).</div>';

  return h;
}

function planetsHtml(d) {
  var h = '<div class="section"><div class="section-title">Planetary Deep Analysis  20+ Attributes per Planet</div>';
  Object.entries(d.planetary_deep.planets).forEach(function(e) {
    var name = e[0], p = e[1];
    h += '<div class="planet-card">';
    h += '<div class="planet-name">' + name + '</div>';
    h += '<div class="planet-grid">';
    h += '<div class="planet-attr"><div class="planet-attr-label">Rashi</div><div class="planet-attr-value">' + p.rashi + ' ' + p.degree + ' deg</div></div>';
    h += '<div class="planet-attr"><div class="planet-attr-label">House</div><div class="planet-attr-value">' + p.house + '</div></div>';
    h += '<div class="planet-attr"><div class="planet-attr-label">Dignity</div><div class="planet-attr-value">' + p.dignity + '</div></div>';
    h += '<div class="planet-attr"><div class="planet-attr-label">Avastha</div><div class="planet-attr-value">' + p.avastha.state + '</div></div>';
    h += '<div class="planet-attr"><div class="planet-attr-label">Saptavargaja</div><div class="planet-attr-value">' + p.saptavargaja_bala.percentage + '%</div></div>';
    h += '<div class="planet-attr"><div class="planet-attr-label">Digbala</div><div class="planet-attr-value">' + p.digbala.digbala + '/60</div></div>';
    h += '<div class="planet-attr"><div class="planet-attr-label">Ishta Phala</div><div class="planet-attr-value">' + p.ishta_kashta.ishta_phala + '</div></div>';
    h += '<div class="planet-attr"><div class="planet-attr-label">Kashta Phala</div><div class="planet-attr-value">' + p.ishta_kashta.kashta_phala + '</div></div>';
    h += '<div class="planet-attr"><div class="planet-attr-label">Nakshatra Lord</div><div class="planet-attr-value">' + (p.nakshatra_lord || '') + '</div></div>';
    h += '<div class="planet-attr"><div class="planet-attr-label">Nakshatra Deity</div><div class="planet-attr-value">' + (p.nakshatra_deity || '') + '</div></div>';
    h += '</div>';
    h += '<div class="item-reasoning"><strong>Retrograde:</strong> ' + (p.retrograde ? 'Yes' : 'No') + ' | <strong>Combust:</strong> ' + (p.combust ? 'Yes' : 'No') + '</div>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function dashaHtml(d) {
  var h = '<div class="section"><div class="section-title">Complete Dasha  5 Levels</div>';
  var levels = d.complete_dasha.levels;
  var levelNames = ['mahadasha', 'antardasha', 'pratyantardasha', 'sookshma', 'prana'];
  var levelTitles = ['Mahadasha (Major Period)', 'Antardasha (Sub-Period)', 'Pratyantardasha (Sub-Sub)', 'Sookshma (Micro)', 'Prana (Finest)'];
  
  levelNames.forEach(function(lv, i) {
    var level = levels[lv];
    if (!level) return;
    h += '<div class="item"><div class="item-header"><div class="item-title">' + levelTitles[i] + ': ' + level.planet + '</div><span class="badge badge-' + (i < 2 ? 'High' : 'Medium') + '">' + (i < 2 ? 'Active' : 'Current') + '</span></div>';
    h += '<div class="item-body">' + (level.effects ? level.effects.positive : '') + '</div>';
    h += '<div class="item-reasoning"><strong>Period:</strong> ' + level.start_date + ' to ' + level.end_date + '</div>';
    if (level.effects && level.effects.classical_ref) {
      h += '<div class="item-ref">' + level.effects.classical_ref + '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function yogasHtml(d) {
  var h = '<div class="section"><div class="section-title">Complete Yoga Analysis (' + d.yogas_complete.total_yogas + ' Yogas)</div>';
  
  if (d.yogas_complete.auspicious.length) {
    h += '<div class="subsection"><div class="subsection-title">Auspicious Yogas (' + d.yogas_complete.auspicious.length + ')</div>';

    h += '</div>';
  }
  
  h += '</div>';
  return h;
}

  return h;

function explanationsHtml(d) {
  if (!d.explanations || !d.explanations.explanations) {
    return '<div class="section"><div class="section-title">Deep Explanations</div><div class="loading">No explanations available</div></div>';
  }
  var h = '<div class="section"><div class="section-title">Deep Explanations  ' + d.explanations.total + ' Predictions with Full Analysis</div>';
  d.explanations.explanations.forEach(function(e) {
    h += '<div class="item"><div class="item-header"><div class="item-title">' + e.planet + ' in ' + e.rashi + ' (House ' + e.house + ')</div><span class="badge badge-High">' + e.bindu + '/8 bindus</span></div>';
    h += '<div class="item-body"><strong>' + (e.prediction || e.verdict) + '</strong></div>';
    h += '<div class="item-reasoning"><strong>Astrological Reason:</strong> ' + (e.astrological_reason || '') + '</div>';
    h += '<div class="item-reasoning"><strong>Classical Reference:</strong> ' + (e.classical_reference || '') + '</div>';
    if (e.detailed_explanation) {
      h += '<div class="item-reasoning" style="white-space:pre-line;font-size:12px;">' + e.detailed_explanation + '</div>';
    }
    if (e.historical_evidence && e.historical_evidence.length) {
      h += '<div class="item-reasoning"><strong>Historical Evidence:</strong><br>';
      e.historical_evidence.forEach(function(ev) {
        h += ' ' + ev + '<br>';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}


function paragraphsHtml(d) {

  }
  var h = '<div class="section"><div class="section-title">Deep Paragraph Explanations  ' + d.paragraphs_data.total + ' Detailed Analyses</div>';

async function loadCountry(country) {
  document.querySelectorAll('.mp-btn').forEach(function(b) { b.classList.remove('active'); });
  var btn = document.querySelector('.mp-btn[data-country="' + country + '"]');
  if (btn) btn.classList.add('active');
  
  document.getElementById('mpContent').innerHTML = '<div class="loading">Calculating master prediction for ' + country + '...</div>';
  document.getElementById('mpTabs').style.display = 'none';
  
  try {
    var res = await fetch('/api/world/master-v2/predict/' + encodeURIComponent(country));
    if (!res.ok) throw new Error('API error: ' + res.status);
    var d = await res.json();
    DATA = d;
    
    try {
      var pRes = await fetch('/api/world/deep-paragraph/paragraphs/' + encodeURIComponent(country));
      if (pRes.ok) d.paragraphs_data = await pRes.json();
    } catch(e) { console.log('Paragraphs error:', e); }
    
    try {
      var bRes = await fetch('/api/world/deep-paragraph/bnn/' + encodeURIComponent(country));
      if (bRes.ok) d.bnn_data = await bRes.json();
    } catch(e) { console.log('BNN error:', e); }
    
    // Fetch paragraphs
    try {
      var pRes = await fetch('/api/world/deep-paragraph/paragraphs/' + encodeURIComponent(country));
      if (pRes.ok) d.paragraphs_data = await pRes.json();
    } catch(e) { console.log('Paragraphs error:', e); }
    
    // Fetch BNN
    try {
      var bRes = await fetch('/api/world/deep-paragraph/bnn/' + encodeURIComponent(country));
      if (bRes.ok) d.bnn_data = await bRes.json();
    } catch(e) { console.log('BNN error:', e); }
    
    // Fetch paragraphs
    try {
      var pRes = await fetch('/api/world/deep-paragraph/paragraphs/' + encodeURIComponent(country));
      if (pRes.ok) d.paragraphs_data = await pRes.json();
    } catch(e) { console.log('Paragraphs error:', e); }
    
    // Fetch BNN
    try {
      var bRes = await fetch('/api/world/deep-paragraph/bnn/' + encodeURIComponent(country));
      if (bRes.ok) d.bnn_data = await bRes.json();
    } catch(e) { console.log('BNN error:', e); }
    
    var html = '';
    html += '<div id="tab-overview" class="mp-content active">' + overviewHtml(d) + '</div>';
    html += '<div id="tab-planets" class="mp-content">' + planetsHtml(d) + '</div>';
    html += '<div id="tab-dasha" class="mp-content">' + dashaHtml(d) + '</div>';
    html += '<div id="tab-yogas" class="mp-content">' + yogasHtml(d) + '</div>';
    html += '<div id="tab-transit" class="mp-content">' + transitHtml(d) + '</div>';
    html += '<div id="tab-varshphal" class="mp-content">' + varshphalHtml(d) + '</div>';
    html += '<div id="tab-nadi" class="mp-content">' + nadiHtml(d) + '</div>';
    html += '<div id="tab-paragraphs" class="mp-content">' + paragraphsHtml(d) + '</div>';
    html += '<div id="tab-bnn" class="mp-content">' + bnnHtml(d) + '</div>';
    html += '<div id="tab-paragraphs" class="mp-content">' + paragraphsHtml(d) + '</div>';
    html += '<div id="tab-bnn" class="mp-content">' + bnnHtml(d) + '</div>';
    html += '<div id="tab-paragraphs" class="mp-content">' + paragraphsHtml(d) + '</div>';
    html += '<div id="tab-bnn" class="mp-content">' + bnnHtml(d) + '</div>';
    html += '<div id="tab-explanations" class="mp-content">' + explanationsHtml(d) + '</div>';
    
    document.getElementById('mpContent').innerHTML = html;
    document.getElementById('mpTabs').style.display = 'flex';
    document.querySelectorAll('.mp-tab').forEach(function(t) {
      t.onclick = function() { switchTab(t.dataset.tab); };
    });
  } catch (e) {
    document.getElementById('mpContent').innerHTML = '<div class="loading" style="color:#f0a0a0;">Error: ' + e.message + '</div>';
  }
}

function loadCountries() {
  var countries = ['India', 'USA', 'China', 'Russia', 'Pakistan', 'UK', 'Israel', 'Ukraine', 'Japan', 'Germany', 'France', 'Brazil', 'Australia', 'Canada', 'Saudi Arabia', 'Iran', 'North Korea', 'South Korea', 'Nepal', 'Sri Lanka', 'Bangladesh'];
  var h = '';
  countries.forEach(function(c) {
    h += '<button class="mp-btn" data-country="' + c + '" onclick="loadCountry(\'' + c + '\')">' + c + '</button>';
  });
  document.getElementById('mpCountries').innerHTML = h;
  loadCountry('India');
}

document.addEventListener('DOMContentLoaded', loadCountries);
