<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060F">
<title>Cart - VASTU ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-system.css">
<style>
.cart-item {
    display: flex;
    gap: 16px;
    padding: 20px;
    background: var(--space);
    border: 1px solid rgba(248, 247, 242, 0.08);
    border-radius: 12px;
    margin-bottom: 12px;
    align-items: center;
}

.cart-item-image {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--deep-space), var(--space-light));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    flex-shrink: 0;
}

.cart-item-info {
    flex: 1;
}

.cart-item-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--starlight);
    margin-bottom: 4px;
}

.cart-item-price {
    color: var(--cosmic-gold);
    font-size: 14px;
    font-weight: 600;
}

.qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--deep-space);
    border-radius: 8px;
    padding: 4px;
}

.qty-btn {
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    color: var(--starlight);
    cursor: pointer;
    font-size: 18px;
    border-radius: 6px;
    transition: background 0.2s;
    font-weight: 600;
}

.qty-btn:hover { background: rgba(248, 247, 242, 0.08); }

.qty-value {
    width: 40px;
    text-align: center;
    font-weight: 600;
    color: var(--starlight);
}

.cart-summary {
    position: sticky;
    top: 100px;
    background: var(--space);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 12px;
    padding: 24px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    font-size: 14px;
    color: var(--muted-white);
}

.summary-row.total {
    border-top: 1px solid rgba(248, 247, 242, 0.1);
    margin-top: 12px;
    padding-top: 16px;
    font-size: 20px;
    color: var(--starlight);
    font-weight: 700;
    font-family: 'Cormorant Garamond', serif;
}

@media (max-width: 900px) {
    .cart-grid { grid-template-columns: 1fr !important; }
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="container navbar-content">
        <a href="/dashboard.html" class="navbar-brand">VASTU <span class="gold">ONE</span></a>
        <div class="navbar-nav">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/store.html">Store</a>
            <a href="/cart.html" class="active">Cart</a>
            <a href="/my-orders.html">My Orders</a>
            <a href="/lms/courses.html">Academy</a>
        </div>
        <div class="navbar-actions">
            <span class="text-muted text-sm" id="user-name">-</span>
            <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </div>
</nav>

<main class="container" style="padding-top: var(--space-7); padding-bottom: 100px;">

    <div class="mb-6">
        <h1>Shopping Cart</h1>
        <p class="text-muted mt-2" id="cart-subtitle">Loading...</p>
    </div>

    <div class="grid cart-grid" style="grid-template-columns: 1fr 380px; gap: 24px;">
        
        <div id="cart-items">
            <div class="text-muted text-sm">Loading cart...</div>
        </div>

        <div id="cart-summary-container">
            <!-- Summary will load here -->
        </div>

    </div>

</main>

<script src="/static/api.js"></script>
<script>
function handleLogout() {
    VastuAPI.Auth.clear();
    window.location.href = '/login.html';
}

function requireAuth() {
    if (!VastuAPI.Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return false;
    }
    return true;
}

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
}

function getCart() {
    try {
        return JSON.parse(localStorage.getItem('vastu_cart') || '[]');
    } catch (e) { return []; }
}

function saveCart(cart) {
    localStorage.setItem('vastu_cart', JSON.stringify(cart));
}

function categoryEmoji(cat) {
    var map = {
        'Vastu Yantras': '🔱', 'Gemstones': '💎', 'Rudraksha': '📿',
        'Pooja Items': '🪔', 'Books': '📖', 'Vastu Pyramids': '🔺',
        'Wall Plates': '🖼️', 'Services': '🎯'
    };
    return map[cat] || '🛍️';
}

function loadUser() {
    return VastuAPI.API.auth.me().then(function(me) {
        document.getElementById('user-name').textContent = me.full_name;
    }).catch(function(err) { console.error(err); });
}

function renderCart() {
    var cart = getCart();
    var itemsEl = document.getElementById('cart-items');
    var summaryEl = document.getElementById('cart-summary-container');
    
    document.getElementById('cart-subtitle').textContent = 
        cart.length === 0 ? 'Your cart is empty' : cart.length + ' item(s) in cart';
    
    if (cart.length === 0) {
        itemsEl.innerHTML = 
            '<div class="card text-center" style="padding: 60px;">' +
            '<div style="font-size: 64px; margin-bottom: 20px;">🛒</div>' +
            '<h2 class="mb-3">Your cart is empty</h2>' +
            '<p class="text-muted mb-5">Add some products to get started</p>' +
            '<a href="/store.html" class="btn btn-primary">Browse Store</a>' +
            '</div>';
        summaryEl.innerHTML = '';
        return;
    }
    
    var html = '';
    cart.forEach(function(item, idx) {
        var emoji = categoryEmoji('Vastu Yantras');
        var lineTotal = item.price_inr * item.quantity;
        
        html += '<div class="cart-item">' +
            '<div class="cart-item-image">' + emoji + '</div>' +
            '<div class="cart-item-info">' +
            '<div class="cart-item-name">' + escapeHtml(item.name) + '</div>' +
            '<div class="cart-item-price">Rs ' + item.price_inr.toLocaleString('en-IN') + ' each</div>' +
            '</div>' +
            '<div class="qty-control">' +
            '<button class="qty-btn" onclick="changeQty(' + idx + ', -1)">−</button>' +
            '<div class="qty-value">' + item.quantity + '</div>' +
            '<button class="qty-btn" onclick="changeQty(' + idx + ', 1)">+</button>' +
            '</div>' +
            '<div style="text-align: right; min-width: 100px;">' +
            '<div style="font-size: 18px; font-weight: 700; color: var(--cosmic-gold); font-family: \'Cormorant Garamond\', serif;">' +
            'Rs ' + lineTotal.toLocaleString('en-IN') +
            '</div>' +
            '<button class="btn btn-ghost btn-sm" style="color: var(--danger);" onclick="removeItem(' + idx + ')">Remove</button>' +
            '</div>' +
            '</div>';
    });
    
    itemsEl.innerHTML = html;
    
    var subtotal = cart.reduce(function(s, i) { return s + (i.price_inr * i.quantity); }, 0);
    var shipping = subtotal >= 5000 ? 0 : 99;
    var total = subtotal + shipping;
    
    summaryEl.innerHTML = 
        '<div class="cart-summary">' +
        '<h3 class="card-title mb-4">Order Summary</h3>' +
        '<div class="summary-row"><span>Subtotal</span><span>Rs ' + subtotal.toLocaleString('en-IN') + '</span></div>' +
        '<div class="summary-row"><span>Shipping</span><span>' + (shipping === 0 ? 'FREE' : 'Rs ' + shipping) + '</span></div>' +
        '<div class="summary-row total"><span>Total</span><span>Rs ' + total.toLocaleString('en-IN') + '</span></div>' +
        '<a href="/checkout.html" class="btn btn-primary btn-lg btn-block mt-5">Proceed to Checkout →</a>' +
        '<a href="/store.html" class="btn btn-ghost btn-block mt-3">Continue Shopping</a>' +
        '</div>';
}

function changeQty(idx, delta) {
    var cart = getCart();
    if (idx < 0 || idx >= cart.length) return;
    
    cart[idx].quantity += delta;
    if (cart[idx].quantity < 1) cart[idx].quantity = 1;
    
    saveCart(cart);
    renderCart();
}

function removeItem(idx) {
    var cart = getCart();
    cart.splice(idx, 1);
    saveCart(cart);
    VastuAPI.UI.toast('Item removed', 'success');
    renderCart();
}

function init() {
    if (!requireAuth()) return;
    loadUser();
    renderCart();
}

init();
</script>
</body>
</html>
