<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Transit Prediction — Vastu One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/royal-theme.css">
<style>
.real-page { max-width: 1200px; margin: 0 auto; padding: 60px 24px 80px; }
.real-hero { text-align: center; margin-bottom: 40px; }
.real-hero-eyebrow {
  display: inline-flex; align-items: center; gap: 14px;
  font-size: 11px; letter-spacing: 0.32em; color: var(--gold);
  text-transform: uppercase; font-weight: 600;
  padding: 8px 20px; border: 1px solid var(--line-gold);
  border-radius: 100px; margin-bottom: 24px;
}
.real-hero-title {
  font-family: var(--font-display); font-size: 48px; color: var(--ivory);
  margin: 0 0 12px 0; font-weight: 500; letter-spacing: -0.02em;
}
.real-hero-sub {
  font-size: 15px; color: var(--ivory-muted); font-style: italic;
  max-width: 600px; margin: 0 auto;
}
.country-selector {
  display: flex; gap: 10px; justify-content: center; margin: 32px 0;
  flex-wrap: wrap;
}
.country-btn {
  padding: 8px 18px; background: rgba(255,255,255,0.03);
  border: 1px solid var(--line); border-radius: 100px;
  color: var(--ivory-muted); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.25s;
}
.country-btn:hover { border-color: var(--gold); color: var(--ivory); }
.country-btn.active {
  background: rgba(212, 169, 97, 0.15); border-color: var(--gold);
  color: var(--gold);
}
.tabs {
  display: flex; gap: 8px; margin: 32px 0 24px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
}
.tab {
  padding: 12px 20px; background: transparent; border: none;
  color: var(--ivory-muted); font-size: 14px; font-weight: 500;
  cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: all 0.25s;
}
.tab:hover { color: var(--ivory); }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.4s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.transit-card {
  background: linear-gradient(135deg, rgba(90, 20, 32, 0.5), rgba(50, 10, 18, 0.65));
  border: 1px solid var(--line-gold); border-radius: 14px;
  padding: 20px; margin-bottom: 12px;
  display: grid; grid-template-columns: 140px 1fr 100px;
  gap: 20px; align-items: center;
}
.transit-planet {
  font-family: var(--font-display); font-size: 22px; color: var(--gold);
  font-weight: 600;
}
.transit-position { font-size: 13px; color: var(--ivory-muted); margin-top: 4px; }
.transit-effect { font-size: 14px; color: var(--ivory); line-height: 1.6; }
.transit-house {
  font-size: 11px; color: var(--gold); letter-spacing: 0.12em;
  text-transform: uppercase; font-weight: 700;
  background: rgba(212, 169, 97, 0.12); padding: 6px 12px;
  border-radius: 100px; border: 1px solid var(--line-gold);
  text-align: center;
}
.yoga-card {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
  border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 14px;
  padding: 24px; margin-bottom: 16px;
}
.yoga-name {
  font-family: var(--font-display); font-size: 24px; color: #fbbf24;
  font-weight: 600; margin-bottom: 8px;
}
.yoga-effect { font-size: 14px; color: var(--ivory); line-height: 1.6; margin-bottom: 12px; }
.yoga-strength {
  display: inline-block; font-size: 11px; color: #fbbf24;
  background: rgba(245, 158, 11, 0.15); padding: 4px 12px;
  border-radius: 100px; border: 1px solid rgba(245, 158, 11, 0.4);
  font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
}
.chart-section {
  background: rgba(255,255,255,0.03); border: 1px solid var(--line);
  border-radius: 14px; padding: 24px; margin-bottom: 20px;
}
.chart-title {
  font-family: var(--font-display); font-size: 22px; color: var(--gold);
  margin-bottom: 16px;
}
.chart-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.chart-item {
  padding: 12px 16px; background: rgba(255,255,255,0.03);
  border-radius: 10px; border-left: 3px solid var(--gold);
}
.chart-label { font-size: 11px; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
.chart-value { font-size: 15px; color: var(--ivory); margin-top: 4px; font-weight: 500; }
.chart-sub { font-size: 12px; color: var(--ivory-muted); margin-top: 2px; }
.loading { text-align: center; padding: 60px; color: var(--ivory-muted); }
@media (max-width: 768px) {
  .transit-card { grid-template-columns: 1fr; gap: 12px; }
  .real-hero-title { font-size: 32px; }
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none;">VASTU <span class="brand-mark">✦</span> ONE</a></div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/world-prediction.html">World</a>
      <a href="/real-transit.html" class="active">Real Transit</a>
    </nav>
  </div>
</header>

<main class="real-page">
  <div class="real-hero">
    <div class="real-hero-eyebrow">🪐 Swiss Ephemeris · Real Calculations</div>
    <h1 class="real-hero-title">Real Transit Prediction</h1>
    <p class="real-hero-sub">Actual planetary positions calculated via Swiss Ephemeris — Birth chart vs today's transit</p>
  </div>

  <div class="country-selector" id="countrySelector">
    <div class="loading">Loading countries...</div>
  </div>

  <div class="tabs" id="tabs" style="display:none;">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="transit">Transit Planets</button>
    <button class="tab" data-tab="yogas">Yogas Detected</button>
    <button class="tab" data-tab="birth">Birth Chart</button>
  </div>

  <div id="content">
    <div class="loading">Select a country to see real transit analysis</div>
  </div>
</main>

<footer class="foot" style="padding:40px;text-align:center;border-top:1px solid var(--line);">
  <div style="font-size:12px;color:var(--ivory-dim);">© 2026 Vastu One · Nagpur, Maharashtra</div>
</footer>

<script>
var CURRENT_DATA = null;

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
  document.querySelector('.tab[data-tab="' + tabName + '"]').classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');
}

function renderOverview(data) {
  var html = '';
  var bc = data.birth_chart;
  html += '<div class="chart-section">';
  html += '<div class="chart-title">Birth Chart — ' + data.country + '</div>';
  html += '<div class="chart-grid">';
  html += '<div class="chart-item"><div class="chart-label">Ascendant</div><div class="chart-value">' + bc.ascendant.rashi + ' ' + bc.ascendant.degree + '°</div></div>';
  html += '<div class="chart-item"><div class="chart-label">Sun</div><div class="chart-value">' + bc.sun.rashi + ' ' + bc.sun.degree + '°</div><div class="chart-sub">' + (bc.sun.nakshatra || '') + ' pada ' + (bc.sun.pada || '') + '</div></div>';
  html += '<div class="chart-item"><div class="chart-label">Moon</div><div class="chart-value">' + bc.moon.rashi + ' ' + bc.moon.degree + '°</div><div class="chart-sub">' + (bc.moon.nakshatra || '') + ' pada ' + (bc.moon.pada || '') + '</div></div>';
  html += '</div></div>';
  
  html += '<div class="chart-section">';
  html += '<div class="chart-title">Key Transit Effects (' + data.date + ')</div>';
  data.transit.forEach(function(t) {
    html += '<div class="transit-card">';
    html += '<div><div class="transit-planet">' + t.planet + '</div><div class="transit-position">' + t.rashi + ' ' + t.degree + '°</div></div>';
    html += '<div class="transit-effect">' + t.effect + '</div>';
    html += '<div class="transit-house">House ' + t.house + '</div>';
    html += '</div>';
  });
  html += '</div>';
  
  if (data.yogas && data.yogas.length) {
    html += '<div class="chart-section">';
    html += '<div class="chart-title">Active Yogas</div>';
    data.yogas.forEach(function(y) {
      html += '<div class="yoga-card">';
      html += '<div class="yoga-name">' + y.name + '</div>';
      html += '<div class="yoga-effect">' + y.effect + '</div>';
      html += '<span class="yoga-strength">' + y.strength + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  return html;
}

function renderTransit(data) {
  var html = '<div class="chart-section"><div class="chart-title">All Transit Planets</div>';
  data.transit.forEach(function(t) {
    html += '<div class="transit-card">';
    html += '<div><div class="transit-planet">' + t.planet + '</div><div class="transit-position">' + t.rashi + ' ' + t.degree + '°</div></div>';
    html += '<div class="transit-effect"><strong>House ' + t.house + ':</strong> ' + t.house_meaning + '<br><em>' + t.effect + '</em></div>';
    html += '<div class="transit-house">House ' + t.house + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderYogas(data) {
  if (!data.yogas || !data.yogas.length) {
    return '<div class="loading">No active yogas detected today</div>';
  }
  var html = '<div class="chart-section"><div class="chart-title">Yogas Detected</div>';
  data.yogas.forEach(function(y) {
    html += '<div class="yoga-card">';
    html += '<div class="yoga-name">' + y.name + '</div>';
    html += '<div class="yoga-effect">' + y.effect + '</div>';
    html += '<span class="yoga-strength">' + y.strength + '</span>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderBirth(data) {
  var bc = data.birth_chart;
  var html = '<div class="chart-section"><div class="chart-title">Birth Chart — ' + data.country + '</div>';
  html += '<div class="chart-grid">';
  html += '<div class="chart-item"><div class="chart-label">Ascendant</div><div class="chart-value">' + bc.ascendant.rashi + ' ' + bc.ascendant.degree + '°</div></div>';
  html += '<div class="chart-item"><div class="chart-label">Sun</div><div class="chart-value">' + bc.sun.rashi + ' ' + bc.sun.degree + '°</div><div class="chart-sub">' + (bc.sun.nakshatra || '') + ' pada ' + (bc.sun.pada || '') + '</div></div>';
  html += '<div class="chart-item"><div class="chart-label">Moon</div><div class="chart-value">' + bc.moon.rashi + ' ' + bc.moon.degree + '°</div><div class="chart-sub">' + (bc.moon.nakshatra || '') + ' pada ' + (bc.moon.pada || '') + '</div></div>';
  html += '</div></div>';
  return html;
}

function renderAllTabs(data) {
  var content = document.getElementById('content');
  content.innerHTML =
    '<div id="tab-overview" class="tab-content active">' + renderOverview(data) + '</div>' +
    '<div id="tab-transit" class="tab-content">' + renderTransit(data) + '</div>' +
    '<div id="tab-yogas" class="tab-content">' + renderYogas(data) + '</div>' +
    '<div id="tab-birth" class="tab-content">' + renderBirth(data) + '</div>';
}

async function loadCountry(country) {
  document.querySelectorAll('.country-btn').forEach(function(b) { b.classList.remove('active'); });
  var btn = document.querySelector('.country-btn[data-country="' + country + '"]');
  if (btn) btn.classList.add('active');
  
  document.getElementById('content').innerHTML = '<div class="loading">Calculating real planetary positions for ' + country + '...</div>';
  document.getElementById('tabs').style.display = 'none';
  
  try {
    var res = await fetch('/api/world/real/transit/' + encodeURIComponent(country));
    if (!res.ok) throw new Error('API error: ' + res.status);
    var data = await res.json();
    CURRENT_DATA = data;
    renderAllTabs(data);
    document.getElementById('tabs').style.display = 'flex';
    document.querySelectorAll('.tab').forEach(function(t) {
      t.onclick = function() { switchTab(t.dataset.tab); };
    });
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="loading" style="color:#f0a0a0;">Error: ' + e.message + '</div>';
  }
}

function loadCountries() {
  var countries = ['India', 'USA', 'China', 'Russia', 'Pakistan', 'UK', 'Israel', 'Ukraine', 'Japan', 'Germany', 'France', 'Brazil', 'Australia', 'Canada', 'Saudi Arabia', 'Iran', 'North Korea', 'South Korea', 'Nepal', 'Sri Lanka', 'Bangladesh', 'Afghanistan', 'Turkey', 'Egypt', 'South Africa'];
  var html = '';
  countries.forEach(function(c) {
    html += '<button class="country-btn" data-country="' + c + '" onclick="loadCountry(\'' + c + '\')">' + c + '</button>';
  });
  document.getElementById('countrySelector').innerHTML = html;
  loadCountry('India');
}

document.addEventListener('DOMContentLoaded', loadCountries);
</script>

</body>
</html>
