<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice — Vastu One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/royal-theme.css">
<style>
/* ═══ INVOICE SPECIFIC STYLES ═══ */
.invoice-wrapper {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

.invoice-page {
  background: #ffffff !important;
  color: #1a1a1a !important;
  padding: 48px 56px;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  font-family: 'Inter', -apple-system, sans-serif;
}

.invoice-page * {
  color: #1a1a1a !important;
}

.invoice-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding-bottom: 24px;
  border-bottom: 3px double #6b1420;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}

.invoice-brand-name {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 34px;
  font-weight: 600;
  color: #6b1420 !important;
  margin: 0 0 6px 0;
  letter-spacing: 0.02em;
}

.invoice-brand-sub {
  font-size: 11px;
  color: #8a7563 !important;
  letter-spacing: 0.28em;
  font-weight: 600;
  text-transform: uppercase;
}

.invoice-meta {
  text-align: right;
  font-size: 13px;
  line-height: 1.9;
}

.invoice-meta strong {
  color: #1a1a1a !important;
  font-weight: 700;
}

.invoice-meta span {
  color: #5c4433 !important;
}

.invoice-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  margin-bottom: 32px;
}

.invoice-info-label {
  font-size: 10px;
  color: #6b1420 !important;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  font-weight: 700;
  margin-bottom: 10px;
}

.invoice-info-value {
  font-size: 15px;
  color: #1a1a1a !important;
  font-weight: 600;
  margin-bottom: 4px;
}

.invoice-info-detail {
  font-size: 13px;
  color: #5c4433 !important;
  line-height: 1.7;
}

.invoice-info-detail strong {
  color: #1a1a1a !important;
  font-weight: 700;
}

.invoice-status-badge {
  display: inline-block;
  padding: 4px 12px;
  background: #ecfdf5;
  color: #059669 !important;
  border: 1px solid #10b981;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.invoice-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 28px;
  font-size: 14px;
}

.invoice-table thead {
  background: #6b1420;
}

.invoice-table thead th {
  padding: 14px 16px;
  text-align: left;
  color: #ffffff !important;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.invoice-table thead th.text-center { text-align: center; }
.invoice-table thead th.text-right { text-align: right; }

.invoice-table tbody tr {
  border-bottom: 1px solid #e5e0d8;
}

.invoice-table tbody td {
  padding: 18px 16px;
  color: #1a1a1a !important;
  vertical-align: top;
}

.invoice-table tbody td.item-name {
  font-weight: 700;
  margin-bottom: 4px;
}

.invoice-table tbody td.item-desc {
  font-size: 12px;
  color: #8a7563 !important;
  margin-top: 4px;
}

.invoice-table tbody td.text-center { text-align: center; }
.invoice-table tbody td.text-right { text-align: right; font-weight: 700; }

.invoice-total-section {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 32px;
}

.invoice-total-box {
  min-width: 300px;
}

.invoice-total-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  font-size: 14px;
}

.invoice-total-row span:first-child {
  color: #5c4433 !important;
}

.invoice-total-row span:last-child {
  color: #1a1a1a !important;
  font-weight: 600;
}

.invoice-grand-total {
  display: flex;
  justify-content: space-between;
  padding: 16px 0;
  border-top: 2px solid #6b1420;
  margin-top: 8px;
  font-size: 20px;
  font-weight: 700;
}

.invoice-grand-total span:first-child {
  color: #6b1420 !important;
}

.invoice-grand-total span:last-child {
  color: #6b1420 !important;
}

.invoice-footer {
  padding-top: 24px;
  border-top: 1px solid #e5e0d8;
  text-align: center;
}

.invoice-footer-thanks {
  font-size: 14px;
  color: #6b1420 !important;
  font-weight: 700;
  margin-bottom: 6px;
}

.invoice-footer-tagline {
  font-size: 12px;
  color: #8a7563 !important;
  font-style: italic;
  margin-bottom: 4px;
}

.invoice-footer-made {
  font-size: 12px;
  color: #8a7563 !important;
}

.invoice-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 24px;
  flex-wrap: wrap;
}

.invoice-btn {
  padding: 16px 32px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  font-family: 'Inter', sans-serif;
  transition: all 0.25s;
}

.invoice-btn-primary {
  background: linear-gradient(135deg, #e0b968, #d4a961, #b8893b);
  color: #2a0810 !important;
  box-shadow: 0 12px 32px rgba(212, 169, 97, 0.4);
}

.invoice-btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 40px rgba(212, 169, 97, 0.5);
}

.invoice-btn-secondary {
  background: transparent;
  color: #f5ede0 !important;
  border: 1px solid rgba(212, 169, 97, 0.4);
}

.invoice-btn-secondary:hover {
  border-color: #d4a961;
  color: #d4a961 !important;
}

/* ═══ MOBILE RESPONSIVE ═══ */
@media (max-width: 768px) {
  .invoice-wrapper {
    margin: 20px auto;
    padding: 0 12px;
  }

  .invoice-page {
    padding: 24px 20px;
    border-radius: 8px;
  }

  .invoice-brand-name {
    font-size: 24px;
  }

  .invoice-brand-sub {
    font-size: 9px;
    letter-spacing: 0.2em;
  }

  .invoice-header {
    flex-direction: column;
    align-items: flex-start;
    padding-bottom: 16px;
    margin-bottom: 20px;
  }

  .invoice-meta {
    text-align: left;
    font-size: 12px;
  }

  .invoice-info-grid {
    grid-template-columns: 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  .invoice-info-label {
    font-size: 9px;
    margin-bottom: 6px;
  }

  .invoice-info-value {
    font-size: 13px;
  }

  .invoice-info-detail {
    font-size: 12px;
  }

  /* Table — Horizontal scroll on mobile */
  .invoice-table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 20px;
  }

  .invoice-table {
    min-width: 500px;
    font-size: 12px;
  }

  .invoice-table thead th {
    padding: 10px 8px;
    font-size: 9px;
  }

  .invoice-table tbody td {
    padding: 12px 8px;
    font-size: 12px;
  }

  .invoice-table tbody td.item-desc {
    font-size: 10px;
  }

  .invoice-total-section {
    margin-bottom: 20px;
  }

  .invoice-total-box {
    min-width: 100%;
  }

  .invoice-total-row {
    font-size: 12px;
    padding: 8px 0;
  }

  .invoice-grand-total {
    font-size: 16px;
    padding: 12px 0;
  }

  .invoice-footer-thanks {
    font-size: 13px;
  }

  .invoice-footer-tagline,
  .invoice-footer-made {
    font-size: 11px;
  }

  .invoice-actions {
    flex-direction: column;
    gap: 10px;
  }

  .invoice-btn {
    width: 100%;
    padding: 14px 20px;
    font-size: 12px;
  }
}

@media (max-width: 480px) {
  .invoice-page {
    padding: 20px 16px;
  }

  .invoice-brand-name {
    font-size: 20px;
  }

  .invoice-info-value {
    font-size: 12px;
  }

  .invoice-table {
    min-width: 400px;
  }
}

@media print {
  .invoice-actions, .nav, .foot { display: none !important; }
  .invoice-page { box-shadow: none; padding: 20px; }
  body { background: #fff !important; }
  .invoice-wrapper { margin: 0; padding: 0; }
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none;">VASTU <span class="brand-mark">✦</span> ONE</a></div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/kundli-pro.html">Kundli Pro</a>
      <a href="/my-orders.html">Orders</a>
    </nav>
  </div>
</header>

<main>
  <div style="max-width:900px;margin:0 auto;padding:60px 20px 20px;">
    <div class="legal-eyebrow" style="font-size:11px;color:var(--gold);letter-spacing:0.32em;text-transform:uppercase;font-weight:600;margin-bottom:16px;">Account · Invoice</div>
    <h1 style="font-family:var(--font-display);font-size:42px;color:var(--ivory);margin:0 0 8px 0;font-weight:500;">Your Invoice</h1>
    <p style="font-size:15px;color:var(--ivory-muted);font-style:italic;margin:0 0 32px 0;">Download your tax invoice for this order</p>
  </div>

  <div class="invoice-wrapper">
    <div id="invoiceContent" class="invoice-page">
      <div style="text-align:center;padding:60px 20px;">
        <div style="font-size:36px;color:#d4a961;margin-bottom:16px;">📄</div>
        <div style="font-family:'Fraunces',Georgia,serif;font-size:22px;color:#1a1a1a;margin-bottom:8px;">Loading Invoice...</div>
        <div style="font-size:13px;color:#8a7563;">Please wait while we fetch your order details</div>
      </div>
    </div>
  </div>

  <div id="invoiceActions" class="invoice-actions" style="display:none;max-width:900px;margin:24px auto 60px;padding:0 20px;">
    <button class="invoice-btn invoice-btn-primary" onclick="window.print()">🖨️ Print / Save PDF</button>
    <button class="invoice-btn invoice-btn-secondary" onclick="window.close()">✕ Close</button>
  </div>
</main>

<script>
(async function() {
  var params = new URLSearchParams(window.location.search);
  var orderId = params.get('order_id') || params.get('payment_id') || 'test_123';
  var customerEmail = params.get('email') || 'dashaenterprises21@gmail.com';
  var customerName = params.get('name') || 'Customer';
  var amount = params.get('amount') || '505';

  var invoiceNumber = 'INV-' + String(orderId).replace(/[^A-Z0-9]/gi, '').slice(-8).toUpperCase();
  var invoiceDate = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

  var html = 
    '<div class="invoice-header">' +
      '<div>' +
        '<div class="invoice-brand-name">VASTU ONE</div>' +
        '<div class="invoice-brand-sub">Tax Invoice</div>' +
      '</div>' +
      '<div class="invoice-meta">' +
        '<div><strong>Invoice #:</strong> <span>' + invoiceNumber + '</span></div>' +
        '<div><strong>Date:</strong> <span>' + invoiceDate + '</span></div>' +
      '</div>' +
    '</div>' +

    '<div class="invoice-info-grid">' +
      '<div>' +
        '<div class="invoice-info-label">Bill To</div>' +
        '<div class="invoice-info-value">' + customerName + '</div>' +
        '<div class="invoice-info-detail">' + customerEmail + '</div>' +
      '</div>' +
      '<div>' +
        '<div class="invoice-info-label">Payment Details</div>' +
        '<div class="invoice-info-detail">' +
          '<div><strong>Method:</strong> Razorpay</div>' +
          '<div><strong>Payment ID:</strong> <span style="font-family:monospace;font-size:12px;">' + orderId + '</span></div>' +
          '<div style="margin-top:8px;"><span class="invoice-status-badge">✓ Paid</span></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="invoice-table-wrapper">' +
      '<table class="invoice-table">' +
        '<thead>' +
          '<tr>' +
            '<th>Item Description</th>' +
            '<th class="text-center" style="width:70px;">Qty</th>' +
            '<th class="text-right" style="width:120px;">Amount</th>' +
          '</tr>' +
        '</thead>' +
        '<tbody>' +
          '<tr>' +
            '<td>' +
              '<div class="item-name">Premium Kundli PDF Report</div>' +
              '<div class="item-desc">Complete 50+ page Vedic astrology report with 41 engines</div>' +
            '</td>' +
            '<td class="text-center">1</td>' +
            '<td class="text-right">' + amount + '.00</td>' +
          '</tr>' +
        '</tbody>' +
      '</table>' +
    '</div>' +

    '<div class="invoice-total-section">' +
      '<div class="invoice-total-box">' +
        '<div class="invoice-total-row">' +
          '<span>Subtotal:</span>' +
          '<span>' + amount + '.00</span>' +
        '</div>' +
        '<div class="invoice-total-row">' +
          '<span>GST (18%):</span>' +
          '<span>Included</span>' +
        '</div>' +
        '<div class="invoice-grand-total">' +
          '<span>Grand Total:</span>' +
          '<span>' + amount + '.00</span>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="invoice-footer">' +
      '<div class="invoice-footer-thanks">Thank you for your business!</div>' +
      '<div class="invoice-footer-tagline">Vastu One · Every finding has a source</div>' +
      '<div class="invoice-footer-made">Nagpur, Maharashtra · Made with care in India 🇮🇳</div>' +
    '</div>';

  document.getElementById('invoiceContent').innerHTML = html;
  document.getElementById('invoiceActions').style.display = 'flex';
})();
</script>

<footer class="foot" style="padding:40px;text-align:center;border-top:1px solid var(--line);margin-top:40px;">
  <div style="font-size:12px;color:var(--ivory-dim);">© 2026 Vastu One · Nagpur, Maharashtra</div>
  <div style="margin-top:16px;font-size:12px;">
    <a href="/legal/privacy.html" style="color:var(--gold);text-decoration:none;margin:0 12px;">Privacy</a>
    <a href="/legal/terms.html" style="color:var(--gold);text-decoration:none;margin:0 12px;">Terms</a>
    <a href="/legal/refund.html" style="color:var(--gold);text-decoration:none;margin:0 12px;">Refund</a>
  </div>
</footer>

</body>
</html>
