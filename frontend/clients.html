<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients — VASTU ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-system.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="container navbar-content">
        <a href="/dashboard.html" class="navbar-brand">
            VASTU <span class="gold">ONE</span>
        </a>
        <div class="navbar-nav">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/clients.html" class="active">Clients</a>
            <a href="/properties.html">Properties</a>
            <a href="/reports.html">Reports</a>
            <a href="/lms/courses.html">LMS</a>
        </div>
        <div class="flex gap-3" style="align-items: center;">
            <span class="text-muted text-sm" id="user-name">—</span>
            <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </div>
</nav>

<main class="container" style="padding-top: var(--space-7); padding-bottom: var(--space-7);">

    <!-- HEADER -->
    <div class="flex-between mb-6">
        <div>
            <h1>Clients</h1>
            <p class="text-muted mt-2">Manage your consultation clients</p>
        </div>
        <button class="btn btn-primary" onclick="openCreateModal()">+ New Client</button>
    </div>

    <!-- SEARCH -->
    <div class="card mb-5">
        <input type="text" class="form-input" id="search-input"
               placeholder="🔍 Search by name, email, or phone..."
               oninput="filterClients()">
    </div>

    <!-- CLIENTS LIST -->
    <div id="clients-list">
        <div class="text-muted text-sm">Loading...</div>
    </div>

</main>

<!-- CREATE/EDIT MODAL -->
<div class="modal-backdrop hidden" id="client-modal">
    <div class="modal">
        <div class="flex-between mb-5">
            <h3 class="card-title" id="modal-title">New Client</h3>
            <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
        </div>
        
        <form id="client-form" onsubmit="handleSubmit(event)">
            <input type="hidden" id="client-id">
            
            <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-input" id="form-name" required
                       placeholder="Rajesh Kumar">
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="form-email"
                       placeholder="rajesh@example.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-input" id="form-phone"
                       placeholder="9876543210">
            </div>
            
            <div class="form-group">
                <label class="form-label">Address</label>
                <textarea class="form-textarea" id="form-address" rows="2"
                          placeholder="123 MG Road, Nagpur, Maharashtra"></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-label">Notes</label>
                <textarea class="form-textarea" id="form-notes" rows="2"
                          placeholder="Residential property consultation"></textarea>
            </div>
            
            <div class="flex gap-3 mt-5">
                <button type="button" class="btn btn-ghost" style="flex: 1;" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" style="flex: 2;" id="submit-btn">Save Client</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/api.js"></script>
<script>
let allClients = [];
let filteredClients = [];

async function handleLogout() {
    VastuAPI.Auth.clear();
    window.location.href = '/login.html';
}

async function requireAuth() {
    if (!VastuAPI.Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return false;
    }
    return true;
}

async function loadUser() {
    try {
        const me = await VastuAPI.API.auth.me();
        VastuAPI.Auth.setUser(me);
        document.getElementById('user-name').textContent = me.full_name;
    } catch (err) {
        console.error('User load failed:', err);
    }
}

async function loadClients() {
    try {
        VastuAPI.UI.loading(true);
        const data = await VastuAPI.API.clients.list(0, 200);
        allClients = data.items || [];
        filteredClients = [...allClients];
        renderClients();
    } catch (err) {
        VastuAPI.UI.toast('Failed to load clients: ' + err.message, 'error');
    } finally {
        VastuAPI.UI.loading(false);
    }
}

function filterClients() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    if (!q) {
        filteredClients = [...allClients];
    } else {
        filteredClients = allClients.filter(c =>
            (c.full_name || '').toLowerCase().includes(q) ||
            (c.email || '').toLowerCase().includes(q) ||
            (c.phone || '').includes(q)
        );
    }
    renderClients();
}

function renderClients() {
    const el = document.getElementById('clients-list');
    
    if (!filteredClients.length) {
        el.innerHTML = `
            <div class="card text-center" style="padding: var(--space-7);">
                <div class="text-muted mb-4">
                    ${allClients.length === 0 ? 'No clients yet.' : 'No clients match your search.'}
                </div>
                ${allClients.length === 0 ? '<button class="btn btn-primary" onclick="openCreateModal()">+ Add First Client</button>' : ''}
            </div>
        `;
        return;
    }
    
    el.innerHTML = `
        <div class="text-muted text-sm mb-4">Showing ${filteredClients.length} of ${allClients.length} clients</div>
        ${filteredClients.map(c => `
            <div class="card mb-3">
                <div class="flex-between" style="align-items: flex-start;">
                    <div style="flex: 1;">
                        <div style="font-weight: 600; font-size: 16px;">${escapeHtml(c.full_name)}</div>
                        <div class="text-muted text-sm mt-2">
                            ${c.email ? `<span>📧 ${escapeHtml(c.email)}</span>` : ''}
                            ${c.phone ? `<span style="margin-left: 12px;">📞 ${escapeHtml(c.phone)}</span>` : ''}
                        </div>
                        ${c.address ? `<div class="text-faint text-sm mt-2">📍 ${escapeHtml(c.address)}</div>` : ''}
                        ${c.notes ? `<div class="text-faint text-sm mt-2">📝 ${escapeHtml(c.notes)}</div>` : ''}
                        <div class="text-faint text-xs mt-3">
                            Added ${VastuAPI.UI.formatDate(c.created_at)}
                        </div>
                    </div>
                    <div class="flex gap-2" style="align-items: flex-start;">
                        <a href="/properties.html?client_id=${c.id}" class="btn btn-secondary btn-sm">Properties</a>
                        <button class="btn btn-ghost btn-sm" onclick='openEditModal(${JSON.stringify(c).replace(/'/g, "&#39;")})'>Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="handleDelete('${c.id}', '${escapeHtml(c.full_name)}')">Delete</button>
                    </div>
                </div>
            </div>
        `).join('')}
    `;
}

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
}

function openCreateModal() {
    document.getElementById('modal-title').textContent = 'New Client';
    document.getElementById('client-form').reset();
    document.getElementById('client-id').value = '';
    document.getElementById('submit-btn').textContent = 'Create Client';
    document.getElementById('client-modal').classList.remove('hidden');
}

function openEditModal(client) {
    document.getElementById('modal-title').textContent = 'Edit Client';
    document.getElementById('client-id').value = client.id;
    document.getElementById('form-name').value = client.full_name || '';
    document.getElementById('form-email').value = client.email || '';
    document.getElementById('form-phone').value = client.phone || '';
    document.getElementById('form-address').value = client.address || '';
    document.getElementById('form-notes').value = client.notes || '';
    document.getElementById('submit-btn').textContent = 'Update Client';
    document.getElementById('client-modal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('client-modal').classList.add('hidden');
}

async function handleSubmit(e) {
    e.preventDefault();
    const id = document.getElementById('client-id').value;
    
    const payload = {
        full_name: document.getElementById('form-name').value,
        email: document.getElementById('form-email').value || null,
        phone: document.getElementById('form-phone').value || null,
        address: document.getElementById('form-address').value || null,
        notes: document.getElementById('form-notes').value || null,
    };
    
    try {
        VastuAPI.UI.loading(true);
        if (id) {
            await VastuAPI.API.clients.update(id, payload);
            VastuAPI.UI.toast('Client updated', 'success');
        } else {
            await VastuAPI.API.clients.create(payload);
            VastuAPI.UI.toast('Client created', 'success');
        }
        closeModal();
        await loadClients();
    } catch (err) {
        VastuAPI.UI.toast('Failed: ' + err.message, 'error');
    } finally {
        VastuAPI.UI.loading(false);
    }
}

async function handleDelete(id, name) {
    if (!confirm(`Delete "${name}"? This will also delete all their properties and reports.`)) return;
    try {
        VastuAPI.UI.loading(true);
        await VastuAPI.API.clients.remove(id);
        VastuAPI.UI.toast('Client deleted', 'success');
        await loadClients();
    } catch (err) {
        VastuAPI.UI.toast('Delete failed: ' + err.message, 'error');
    } finally {
        VastuAPI.UI.loading(false);
    }
}

// Close modal on escape
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

async function init() {
    if (!await requireAuth()) return;
    await loadUser();
    await loadClients();
}

init();
</script>
</body>
</html>
