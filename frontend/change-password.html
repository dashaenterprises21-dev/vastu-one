<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060F">
<title>Change Password — VASTU ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-system.css">
</head>
<body>

<nav class="navbar">
    <div class="container navbar-content">
        <a href="/dashboard.html" class="navbar-brand">VASTU <span class="gold">ONE</span></a>
        <div class="navbar-nav">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/clients.html">Clients</a>
            <a href="/properties.html">Properties</a>
            <a href="/reports.html">Reports</a>
            <a href="/lms/courses.html">LMS</a>
        </div>
        <div class="navbar-actions">
            <span class="text-muted text-sm" id="user-name">—</span>
            <a href="/settings.html" class="btn btn-ghost btn-sm">Settings</a>
            <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </div>
</nav>

<main class="container" style="padding-top: var(--space-7); padding-bottom: var(--space-7); max-width: 600px;">
    
    <a href="/settings.html" class="btn btn-ghost btn-sm mb-5">← Back to Settings</a>
    
    <h1 class="mb-3">Change Password</h1>
    <p class="text-muted mb-6">Update your account password. You'll stay logged in on this device.</p>
    
    <div class="card">
        <form id="change-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-input" id="current" required
                       placeholder="Enter current password" autocomplete="current-password" autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" class="form-input" id="password" required
                       minlength="8" placeholder="Min 8 characters" autocomplete="new-password">
                <div class="form-hint">At least 8 characters</div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-input" id="confirm" required
                       minlength="8" placeholder="Re-enter new password" autocomplete="new-password">
                <div class="form-error hidden" id="match-error">Passwords do not match</div>
            </div>
            
            <div class="flex gap-3 mt-6">
                <a href="/settings.html" class="btn btn-ghost" style="flex: 1;">Cancel</a>
                <button type="submit" class="btn btn-primary" style="flex: 2;" id="submit-btn">
                    Update Password
                </button>
            </div>
        </form>
    </div>
    
</main>

<script src="/static/api.js"></script>
<script>
function handleLogout() {
    VastuAPI.Auth.clear();
    window.location.href = '/login.html';
}

async function requireAuth() {
    if (!VastuAPI.Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return false;
    }
    return true;
}

async function loadUser() {
    try {
        const me = await VastuAPI.API.auth.me();
        document.getElementById('user-name').textContent = me.full_name;
    } catch (err) { console.error(err); }
}

document.getElementById('confirm').addEventListener('input', (e) => {
    const p1 = document.getElementById('password').value;
    const p2 = e.target.value;
    document.getElementById('match-error').classList.toggle('hidden', p1 === p2 || !p2);
});

async function handleSubmit(e) {
    e.preventDefault();
    const current = document.getElementById('current').value;
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const btn = document.getElementById('submit-btn');
    
    if (password !== confirm) {
        VastuAPI.UI.toast('Passwords do not match', 'error');
        return;
    }
    
    if (current === password) {
        VastuAPI.UI.toast('New password must be different', 'error');
        return;
    }
    
    try {
        btn.disabled = true;
        btn.textContent = 'Updating...';
        VastuAPI.UI.loading(true);
        
        await VastuAPI.apiCall('/api/auth/change-password', {
            method: 'POST',
            body: { current_password: current, new_password: password },
        });
        
        VastuAPI.UI.toast('Password updated successfully', 'success');
        document.getElementById('change-form').reset();
        
        setTimeout(() => {
            window.location.href = '/settings.html';
        }, 1500);
    } catch (err) {
        VastuAPI.UI.toast('Error: ' + err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
        VastuAPI.UI.loading(false);
    }
}

(async () => {
    if (!await requireAuth()) return;
    await loadUser();
})();
</script>
</body>
</html>
